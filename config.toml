[limits]
safety_margin_s = 15.0
cases_small = 200
cases_medium = 20
# Floor below which a differential tier is thin evidence rather than coverage, so run_gate marks it
# degraded and solve() demotes the status out of "passed_all_gates". A run that produced far fewer
# cases than the cases_small/cases_medium targets above had an oracle whose gen() mostly crashed or
# whose validate() rejected most of what it generated; 48 small / 4 medium was observed shipping as
# a full pass. Tuned against the 200/20 targets -- raise these together with those.
min_cases_small = 30
min_cases_medium = 5
# ABSOLUTE seconds, deliberately: the statement gives no time limit, so these are our judgment of
# what a hidden judge would allow, and a judge's limit does not grow because our own deadline did.
# They are what the stress step measures the candidate against, not a share of our budget.
stress_limit_python_s = 5.0
stress_limit_rust_s = 2.0
# Below this measured duration a PASSING stress run is not a timing measurement and is recorded as
# degraded (a skipped pass) rather than as evidence of speed. An answer this fast means the candidate
# never did the work: bench14's gen_max named an identifier its own input never created, so the
# candidate rejected a 476 KB input at operation 1 in 0.000 s and a solution needing ~10^11 s at the
# stated limits "passed" the timing gate. Generic over every early-exit shape. The known false
# positive is a genuinely O(1) closed-form answer on a max-size input, which really does finish in
# microseconds; it costs that run "degraded" instead of "pass", never a repair or a failure. Tune it
# down if a problem set is full of such answers -- 0 disables the signal entirely.
stress_min_plausible_s = 0.01
max_repairs = 2
# What the SOLVE call must leave behind, as a FRACTION of usable time (0.16 * 285 = 45.6 s at the
# 300 s deadline it was calibrated on). With solve_attempts = 1 the solve call is the only thing in
# the run that can produce an answer, so its ceiling is "everything except what a gate pass and
# emission need" rather than a share of the generate phase: one gate pass is 2-30 s including a Rust
# compile, plus the emit margin. bench17 gave one Opus attempt 200 s ([phases] generate_call_share
# 0.70 * 285 s usable), it timed out at 199.5 s, and 85 s of the budget went unused. A fraction
# rather than 45 s because what it reserves -- a gate pass -- is itself a share of the run (see
# gate_pass_frac below and [grants]), so a fixed reserve would swallow a short deadline and waste a
# long one. The oracle and stress calls keep generate_call_share -- once preparation overlaps the
# solve call they are no longer on the critical path. Raise it if a gate pass on the problem set
# regularly costs more than a Rust compile plus one differential tier.
solve_reserve_frac = 0.16
# What one gate pass costs, as a fraction of usable time (0.21 * 285 = 59.9 s), used by the
# affordability checks before a repair and before a fresh solve. A gate pass is one differential tier
# after another and each of those is itself a [grants] share, so the whole pass scales with the
# deadline exactly as its parts do. Calibrated on the measured shape at 300 s: a tier bounded at 60 s,
# with the expensive ones (an 82 s medium pass, a 60.9 s edge pass) dominating.
gate_pass_frac = 0.21
# Independent SOLVE attempts, issued concurrently and gated against the same oracle as each reply
# lands; best_candidate() keeps whichever passes the most gates. Two attempts were tuned to a 17s
# non-reasoning coder model, where the second one was free: N attempts cost max() latency, not
# sum(). With a thinking model in the strong role a solve measures 150-200s, which is most of the
# deadline, so the second attempt is not free any more -- it leaves no room for the repair loop,
# and bench16 lost a run to a one-line boundary bug that a repair could have fixed. One attempt
# plus a repair at low effort (see tag_extra on the strong role) is the better trade at this
# latency, and it halves the per-problem cost.
# Raise it back to 2 when the ORACLE is the suspect rather than the solution: two independently
# sampled candidates that produce the SAME answer against the reference are a dispute that
# regenerates the oracle before any repair (verify.candidates_agree), and that evidence needs two
# candidates to exist. Each attempt costs one strong call plus one gate pass, so raise it only with
# the measured elapsed headroom to spend.
solve_attempts = 1
max_syntax_repairs = 2   # separate, smaller-scope budget for a static/compile failure -- a mechanical
                         # fix (missing import, missing mut) must not consume a semantic repair attempt
# Fresh solves per problem: a SOLVE call that starts over from a DIFFERENT algorithm, carrying the
# previous attempt's algorithm, its code and the concrete failure that ended it. Triggered by a
# timing failure on a real max-size input, by a repair that answers ===VERDICT=== approach, or by a
# repaired child scoring below its parent -- three failures no patch can fix (round-10 L1/L2,
# round-13 G4: four candidates for one statement, all asymptotically wrong in the same way, every
# repair a variant of the same approach). Costs one strong SOLVE call plus a gate pass on the result,
# so it only starts while the budget covers [phases] generate_call_share * usable + one gate pass
# (~60 s, from the measured tier timings above) -- with a thinking model that is most of the
# deadline, and a fresh solve started without it could only time out. Raise it only with the
# measured elapsed headroom to spend.
max_fresh_solves = 1
mem_mb = 4096
# Wall limit for ONE case inside the python harness, enforced per call rather than per batch.
# Without it a single pathological input consumes the whole batch grant: measured on 6e43a08ec05a,
# where diff_edge failed at case 0 in milliseconds but still took 60.9s because a later case in the
# same batch hung -- three times over, 159s of a 265s run. Keep it well above a legitimate case
# (tiny edge/small fixtures finish in milliseconds) and well below the batch grant.
per_case_limit_s = 10.0
# Consecutive per-case timeouts after which the python harness stops running a batch and reports the
# rest as skipped. A reference or candidate that times out on five small inputs in a row is dead, not
# slow, and every further case would cost the full per_case_limit_s above for nothing: on 6eca8a9120e0
# the oracle's reference() timed out on 40 of 92 SMALL inputs (sizes <= 6), burned the batch's whole
# 60 s grant, left 5 usable cases, and the gate started at 244 s of 285. Tuned against per_case_limit_s.
max_consecutive_case_timeouts = 5
shrink_budget_s = 3.0
# Wall budget for the whole medium tier -- the gen batch and the reference batch together -- as a
# fraction of usable time (0.07 * 285 = 20 s). Medium is the most expensive evidence per second
# (literal loops over 10^4-10^5 multipliers) and the least decisive; on bench14 gen(seed, "medium")
# took 60.3 s to produce 6 cases and the run never got that time back. It used to be dropped outright
# once the budget left the gate phase, which cost that same run its only mid-size tier a second time
# when the re-prep after an oracle regeneration skipped it with time still on the clock. A box bounds
# the cost without ever silently dropping the tier: if the generator alone spends it, medium ships 0
# cases with the note "medium tier: time box exhausted". A fraction because the tier's cost is a share
# of the run, like every other grant.
medium_tier_frac = 0.07
# A thinking strong model at $5/$25 per 1M costs far more per problem than the coder model it
# replaces: two concurrent solves plus up to two repairs, each carrying the statement and up to
# 24000 tokens of thinking and answer. Raised from 0.50 so the cap bounds a runaway rather than
# stopping the second repair of an ordinary run.
max_cost_usd_per_problem = 1.50
# Fraction of the old small inputs on which a REGENERATED oracle may disagree with the oracle it
# replaces before its differential evidence is marked degraded. Two references written from the same
# prose that disagree on more than half of tiny inputs cannot both be near-correct, so the run has no
# ground truth; tuned against cases_small above (the cross-check reuses those inputs).
oracle_regen_max_disagreement = 0.5
# Fraction of its own gen() output that the oracle's validate() may reject (over the small and medium
# tiers together) before the oracle is regenerated. When validate rejects at least this much, gen and
# validate disagree about the statement's preconditions and one of them is wrong; regenerating both
# from the same list is cheaper than gating on a handful of survivors or on inputs one side calls
# invalid. Tuned against round 8, where four of ten runs shipped unverified on exactly this: 30 of 32
# small inputs rejected (2beff58fa923), 163 of 200 small and 17 of 20 medium (5d02bd0e16ab), 46 of 55
# (6eca8a9120e0) -- all far above half, while an honest validate drops a handful.
validate_reject_frac_regen = 0.5

# Minimum remaining budget (seconds) required before starting another ORACLE call after the first
# one produced no ===ORACLE=== block (timeout or empty reply). This is a CEILING, not the whole
# rule: solve.oracle_afford_s takes the smaller of it and the measured cap of whichever role the
# [roles] table sends the oracle prompt to (timeout_cap_s * 0.5 + 30), so remapping the prompt or
# swapping the model re-tunes the threshold by itself -- it has followed the oracle prompt to the
# strong role and back to the fast one without being touched. It was 130.0, the deepseek-era worst
# case, which refuses a retry through the whole second half of a 300s deadline.
oracle_retry_afford_s = 60.0
# Minimum remaining budget (seconds) required before an ORACLE retry is worth making after a
# TIMED-OUT first call: the retry's own cap plus this, so the oracle is only re-asked while there is
# still time to use what comes back.
#
# It no longer gates the repair loop or the fresh solve. Those two now require the budget to cover
# the call's OWN cap plus one gate pass -- verify.repair_cap (the larger of [phases]
# repair_call_share and the strong role's repair_cap_s) for a repair, generate_call_share for a
# fresh solve -- because a fixed 60 s threshold said "affordable" for a call that needs 120 s and
# can only time out. bench16 spent 67 s of a 285 s run that way.
repair_afford_s = 60.0

# Minimum remaining budget (seconds) required to trigger one oracle self-repair regeneration when
# prepare_gate_inputs comes back with zero usable cases in every tier (small/medium/edge) -- the
# oracle CALL succeeded but its reference()/gen()/validate() code crashed at runtime. Same cost
# profile as the initial ORACLE call and its retry (oracle_retry_afford_s), since regeneration writes
# the same reference+gen+validate functions; independent of, and can fire alongside, the adjudication
# regeneration in the repair loop (that one has no separate afford threshold -- it's gated by the
# repair loop's own repair_afford_s check instead).
# Same ceiling rule and the same reason as oracle_retry_afford_s above, and it follows whichever
# role [roles] maps the oracle prompt to rather than naming a model: it was 130.0, which on
# bench19 refused a regeneration at 180s with 105s still on the clock, for an oracle prep had
# already reported as weak AND self-rejecting at 18s. The health triggers now fire during the
# generate-phase overlap, where the remaining budget is nearly the whole deadline, so this number
# only ever binds a LATE trigger (the example dispute, a two-candidate agreement).
oracle_selfrepair_afford_s = 60.0

# Every per-step subprocess grant and reserve, as a FRACTION of usable time (deadline*scale - margin).
# The seconds in each comment are what the value came out to at the 300 s deadline (285 s usable)
# these were calibrated against; solve.DEFAULT_GRANTS holds the same numbers for a config without
# this table.
#
# The problem file supplies only deadline_s. A step budget written as fixed seconds therefore
# misallocates on every deadline but one: a 60 s batch grant is more than half of a 120 s run and a
# twelfth of a 900 s one, and the 20 s it leaves behind stops being a reserve in the first case and
# stops being worth anything in the second. Nothing here is a physical latency -- those (a process
# start-up, a model's time-to-first-token, a judge's time limit) stay absolute seconds in [limits]
# and in the role config, each with a comment saying why.
[grants]
batch = 0.21           # ~60 s: one differential tier, one reference batch, one EDGES build
short = 0.105          # ~30 s: a validate/respell pass, a python import check, an oracle cross-check
tiny = 0.07            # ~20 s: a one-call probe (a single gen(), a skeleton read)
rust_compile = 0.32    # ~90 s: rustc on one candidate, the slowest single subprocess in a run
batch_reserve = 0.07   # ~20 s left behind by a batch-sized step
short_reserve = 0.07   # ~20 s left behind by a short step
call_reserve = 0.035   # ~10 s left behind by a MODEL call, which the finalizer needs in order to emit
stress_reserve = 0.07  # ~20 s on top of the stress limit: a hung python stress call overruns by that much
rust_reserve = 0.053   # ~15 s for the rust stress and overflow calls, which are bounded by limit_s exactly

# Phase boundaries as fractions of usable time (deadline*scale - margin)
[phases]
generate_until = 0.32
gate_until = 0.39
repair_until = 0.81
settle_until = 0.93
# Cap on the concurrent solve/oracle/stress calls, as a fraction of usable_s. The three run
# concurrently, so this phase costs max() of them, not sum() -- see solve.py's solve().
# The SOLVE call is the only one of the three that can create the answer -- the oracle and the
# stress generator only measure it -- so it gets the largest share. Raised from 0.55 once gate-input
# preparation stopped waiting for it (it now overlaps the solve call, see solve()): a candidate
# arriving at 70% of usable still leaves one full gate pass and one repair, because the oracle tiers
# are already built by then. Effective per-call timeout = min(share*usable, role.timeout_cap_s), so
# the role caps still bound each one; the fast role's 150 s cap is what binds its two calls in practice.
generate_call_share = 0.70
# Cap on a single repair call, as a fraction of usable_s -- same knob shape as generate_call_share,
# so raising/lowering it does not silently get overridden by a hardcoded fraction (see F6).
repair_call_share = 0.25

# Which model role each PROMPT is sent to. Defaults (this table absent) are solve/repair -> strong,
# oracle/stress -> fast; solve.PROMPT_ROLES holds them, and the shipped table below is the same
# mapping.
#
# The two measuring calls are what the FAST role exists for, and the constraint on it is latency, not
# price: preparation cannot start until the ORACLE reply lands, so the oracle's latency is dead time
# added to the front of every run unless it returns well inside the solve call's own 152-240 s.
# Round 15 measured both ways of getting that wrong. qwen3-coder returned in 17-24 s and wrote
# oracles that were not ground truth (bench19/bench20: a reference() that rejected half its own gen()
# output, 192 of 200 identical small answers, an unusable regeneration), so the prompts were moved to
# the strong role. That fixed the reading and broke the overlap: in bench21 the Opus oracle at LOW
# effort took 155 s, so preparation began at 155 s instead of ~18 s, and three strong-role calls
# exactly filled max_concurrent = 3.
#
# So the fast role stays the author of both, and the fast role is now a model that reads the
# statement AND returns in under a minute (see [profiles.openrouter.fast]). Returning fast is not the
# same as reading the statement -- but neither is reading the statement worth a minute of the
# deadline spent before any tier exists.
[roles]
solve = "strong"
oracle = "fast"
stress = "fast"
repair = "strong"
# Where a call goes when the provider REFUSES it. Measured live: anthropic/claude-opus-5 returns a
# refusal inside a normal 200 stream ("blocked as it seems to violate Anthropic's Terms of Service
# restrictions on reverse engineering or duplicating model outputs") on this tool's own prompt
# scaffold -- a classifier false positive, the only difference from a prompt that passed being the
# entrypoint NAME. Deterministic with reasoning.effort set (3 of 3), absent with the reasoning
# parameter omitted (1 of 1), and not reproducible on anthropic/claude-sonnet-5 or
# openai/gpt-5.6-terra. So solve.Run.chat retries once with the role's `refusal_extra` shape and
# then once here. Remove the key and there is no fallback: the refusal reply stands.
fallback = "fast"

# Any OpenAI-compatible endpoint can be added as another [profiles.<name>.<role>] table.
# A THINKING model in the strong role. Rounds 10-14 settle what the cheap coder model cannot do:
# qwen3-coder read the semantics of 5cb294c18288 correctly in round 14 -- c4 matched an independent
# reference on 8 366 differential cases -- and never once read the complexity. Four candidates for
# that one statement, two independent solves and two repairs, all materialized a layout the
# statement calls "enormous" and all iterated a count the statement bounds by 10^18; the emitted
# solution needs ~10^11 s at the stated limits. No prompt or gate change reaches that: connecting
# "enormous" to "do not build the list" is the reasoning the strong role exists to buy.
#
# The earlier note here -- "no reasoning model on OpenRouter returns inside a 300s deadline at this
# prompt size" -- was measured with max_tokens at 12000, which the reasoning tokens spend before any
# ===CODE=== block is written; the call then runs to its cap and returns nothing. Reasoning tokens
# count against max_tokens, so the budget has to cover the thinking AND the answer: 24000 here. How
# much of that goes to THINKING is no longer a fixed effort level but reasoning_budget below -- at
# medium effort the call on 5cb294c18288 was cut at 239.4s with no closed CODE block, and medium
# overran the 240s cap in 3 of 10 runs, while low fit easily and sometimes underthought.
[profiles.openrouter.strong]
base_url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-opus-5"
api_key_env = "OPENROUTER_API_KEY"
max_tokens = 24000
max_concurrent = 3
timeout_cap_s = 240.0   # A LATENCY ceiling in absolute seconds, not a share: this model does not
                        # answer faster because the deadline is shorter. The share is [limits]
                        # solve_reserve_frac, and Run.chat takes the min() of the two.
                        # Measured 152-200+ s at medium effort (and twice at the cap); with the
                        # salvage of a cut-off stream (llm.salvageable) a call clipped at this cap
                        # still yields the code when ===CODE=== was emitted, so the cap can sit above
                        # the measured spread. [limits] solve_reserve_frac is what binds first.
stall_timeout_s = 45.0  # absolute: time-to-first-token is a network/model latency, not a share of the
                        # deadline. Longer with thinking, so only a real stall should abort.
price_in_per_m = 5.0
price_out_per_m = 25.0  # OpenRouter reports usage.cost and the client prefers it; these are the fallback
omit_temperature = true  # Claude 5 takes no sampling temperature once thinking is on (same reason as [profiles.anthropic.strong])
extra = {}   # the thinking knob is reasoning_budget, not a fixed effort; nothing else to send
# How much THINKING each call gets, computed from THAT call's timeout (llm._thinking_tokens):
# N = clamp(tokens_per_s * (timeout_s - answer_reserve_s), min_tokens, max_tokens), sent as
# reasoning = { max_tokens = N }. A fixed effort level is wrong for some problem on every deadline --
# medium overran the 240s cap in 3 of 10 runs and low fit easily, and which of the two a statement
# needs is not knowable before the call. The deadline enters through the call timeout, the same way
# every other budget here is a fraction of it, so a 120s deadline and a 900s one buy different
# amounts of thinking without a second table; a repair, whose timeout is a fraction of a solve's,
# gets a proportionally smaller N for free.
#
# tokens_per_s is a measured constant of the MODEL and does NOT scale with the deadline: output runs
# ~70-80 tok/s including reasoning (bench22: 8 805 completion tokens in 107.7s; medium-effort runs
# 13-16k tokens in 152-240s), and 60 leaves headroom under that. answer_reserve_s is the code that
# still has to be written after the thinking stops. max_tokens stays well under the role's 24000
# completion cap, which has to hold the thinking AND the answer.
reasoning_budget = { tokens_per_s = 60.0, answer_reserve_s = 50.0, min_tokens = 2000, max_tokens = 16000 }
# The request shape a REFUSED call is retried with, merged shallowly over `extra` so this `reasoning`
# table REPLACES the budget above for that one retry (solve.Run.chat's first rung). Measured live on the
# prompt this model refuses: effort "low" refused 4 of 4 and "minimal" refused, so an effort rung is
# not a rung at all; { max_tokens = 4000 } passed and { effort = "medium" } passed. Omitting the
# reasoning key also passes the classifier, but it turns on ADAPTIVE thinking -- one live run at that
# rung thought for the whole 239 s budget (4 449 tokens of reasoning summary, no content) and shipped
# nothing. So a bounded token budget: it clears the classifier and keeps latency near low effort,
# which is what the retry has to fit inside what is left of the deadline. No key here = no first rung.
refusal_extra = { reasoning = { max_tokens = 6000 } }
# What a call really cost, asked of the provider when the stream was cut off before its usage chunk
# arrived. The buffer estimate llm.py falls back to ignores reasoning tokens entirely, so a salvaged
# thinking call under-reports by an order of magnitude: bench17 and bench18 reported $0.12 between
# them and the key's usage rose by $0.32. One GET, never retried, failure ignored.
usage_lookup_url = "https://openrouter.ai/api/v1/generation?id={id}"
# No tag_extra here any more. It existed to drop the two post-gate calls (repair, solve_fresh) to a
# lower effort than the solve, and reasoning_budget does that by construction: after the gate the
# deadline is measured in tens of seconds, those calls get a smaller timeout, and a smaller timeout
# is a smaller N. A tag that needs a shape of its own can still pin `reasoning` here and the budget
# will leave it alone.
# Floor for the repair/fresh-solve call cap (verify.repair_cap takes the larger of this and
# [phases] repair_call_share * usable). Absolute seconds on purpose: this is the measured LATENCY of
# a repair by THIS model, which is a fact about the model and not about the deadline. The share is
# the other half of the max(), which is what keeps a short deadline from promising a call it cannot
# fit. The fraction alone is 0.25 * 285 = 71s, tuned when the strong role was a 12-17s non-reasoning
# coder model; against this role it is a guaranteed timeout, and bench16 spent one that way.
# Measured 150-200s per solve at medium effort, expected roughly half of that at the thinking
# budget a cap this size buys (reasoning_budget above: 60 * (120 - 50) = 4200 tokens).
repair_cap_s = 120.0

# The author of the ORACLE and the STRESS module ([roles] above). A THINKING model at low effort:
# it has to read the statement as carefully as the solver does -- the oracle is the ground truth of
# the whole system, and every differential tier is worth exactly what the reference is worth -- and
# it has to come back in well under the solve call's own latency, because preparation cannot start
# before the oracle reply lands.
#
# Three models measured against those two requirements. deepseek: three unusable oracles for one
# problem across rounds 10 and 13 (constant-answer, or 45% wrong against an independent reference)
# at 106-128s per call. qwen3-coder: 17-24s, but in bench19 and bench20 its oracle was the primary
# or the only remaining cause of the run shipping unverified -- a reference() that rejected half its
# own gen() output, 192 of 200 identical small answers, an unusable regeneration. Opus at low effort
# in the strong role read the statement, and took 155s (bench21 oracle) -- preparation started at
# 155s instead of ~18s, and the three concurrent calls exactly filled the strong role's
# max_concurrent = 3. sonnet-5 at low effort is the trade: the same family's reading of the statement
# at roughly a third of the latency and a fifth of the price.
[profiles.openrouter.fast]
base_url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-sonnet-5"
api_key_env = "OPENROUTER_API_KEY"
max_tokens = 12000   # reasoning tokens count against it: the thinking AND the reference+gen+validate
max_concurrent = 3
timeout_cap_s = 150.0   # a LATENCY ceiling in absolute seconds (a model's speed does not follow the
                        # deadline), and an expectation of nothing: a call that needs this long has
                        # already cost the overlap preparation depends on
stall_timeout_s = 45.0  # absolute: time-to-first-token is a network/model latency, not a share of the
                        # deadline. Longer with thinking, so only a real stall should abort.
price_in_per_m = 3.0
price_out_per_m = 15.0  # OpenRouter reports usage.cost and the client prefers it; these are the fallback
omit_temperature = true  # Claude 5 takes no sampling temperature once thinking is on
extra = { reasoning = { effort = "low" } }
usage_lookup_url = "https://openrouter.ai/api/v1/generation?id={id}"

# Anthropic, through its OpenAI-compatible endpoint (which Anthropic describes as a layer for testing
# and comparing models, not a production-grade path). Claude 5 models reject sampling parameters and
# think by default; thinking is disabled because reasoning tokens used up max_tokens before any block
# was written (see SOLVER.md). Prices are $ per 1M tokens and are needed because only OpenRouter
# reports usage.cost. Latency against the [limits] *_afford_s values is unmeasured for these models,
# and at these prices max_cost_usd_per_problem = 0.10 is spent by the first SOLVE calls.
[profiles.anthropic.strong]
base_url = "https://api.anthropic.com/v1"
model = "claude-opus-5"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 12000
max_concurrent = 3
timeout_cap_s = 120.0
omit_temperature = true
price_in_per_m = 5.0
price_out_per_m = 25.0
extra = { thinking = { type = "disabled" } }

[profiles.anthropic.fast]
base_url = "https://api.anthropic.com/v1"
model = "claude-haiku-4-5"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 8000
max_concurrent = 3
timeout_cap_s = 150.0
price_in_per_m = 1.0
price_out_per_m = 5.0
extra = {}

# OpenAI. Reasoning models take max_completion_tokens and only the default temperature; effort is
# minimal for the same reason thinking is off above. Check model ids and prices against OpenAI's
# current pricing page -- both are unmeasured here.
[profiles.openai.strong]
base_url = "https://api.openai.com/v1"
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"
max_tokens = 12000
max_concurrent = 3
timeout_cap_s = 120.0
token_param = "max_completion_tokens"
omit_temperature = true
price_in_per_m = 1.25
price_out_per_m = 10.0
extra = { reasoning_effort = "minimal" }

[profiles.openai.fast]
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
api_key_env = "OPENAI_API_KEY"
max_tokens = 8000
max_concurrent = 3
timeout_cap_s = 150.0
token_param = "max_completion_tokens"
omit_temperature = true
price_in_per_m = 0.25
price_out_per_m = 2.0
extra = { reasoning_effort = "minimal" }
