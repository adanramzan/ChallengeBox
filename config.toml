[limits]
safety_margin_s = 15.0
cases_small = 200
cases_medium = 20
# Floor below which a differential tier is thin evidence rather than coverage, so run_gate marks it
# degraded and solve() demotes the status out of "passed_all_gates". A run that produced far fewer
# cases than the cases_small/cases_medium targets above had an oracle whose gen() mostly crashed or
# whose validate() rejected most of what it generated; 48 small / 4 medium was observed shipping as
# a full pass. Tuned against the 200/20 targets -- raise these together with those.
min_cases_small = 30
min_cases_medium = 5
stress_limit_python_s = 5.0
stress_limit_rust_s = 2.0
max_repairs = 2
# Independent SOLVE attempts, gated against the same oracle; best_candidate() keeps whichever
# passes the most gates. They are issued concurrently, so N costs max() latency, not sum -- the
# strong model returns in ~10-20s of a ~157s generate allowance, so the spare time buys extra
# shots at a correct solution rather than a slower model (no reasoning model on OpenRouter
# returns inside a 300s deadline at this prompt size; see BENCHMARK-FINDINGS-ROUND2.md).
# Each attempt costs one strong call plus, if it is reached, one gate pass -- gating is the
# scarcer resource, so raise this only with the measured elapsed headroom to spend.
solve_attempts = 2
max_syntax_repairs = 2   # separate, smaller-scope budget for a static/compile failure -- a mechanical
                         # fix (missing import, missing mut) must not consume a semantic repair attempt
mem_mb = 4096
# Wall limit for ONE case inside the python harness, enforced per call rather than per batch.
# Without it a single pathological input consumes the whole batch grant: measured on 6e43a08ec05a,
# where diff_edge failed at case 0 in milliseconds but still took 60.9s because a later case in the
# same batch hung -- three times over, 159s of a 265s run. Keep it well above a legitimate case
# (tiny edge/small fixtures finish in milliseconds) and well below the batch grant.
per_case_limit_s = 10.0
shrink_budget_s = 3.0
max_cost_usd_per_problem = 0.10

# Minimum remaining budget (seconds) required before starting another ORACLE call after the first
# one produced no ===ORACLE=== block (timeout or empty reply). Tuned to the measured worst-case
# oracle latency against the current [profiles] models (observed max 128s, +2s margin) -- if a
# different/slower model is configured for the "fast" role, raise this to match its measured max.
oracle_retry_afford_s = 130.0
# Minimum remaining budget (seconds) required to start another repair-loop iteration (a syntax or
# semantic repair call plus re-gating). Generous headroom over the measured repair-call latency
# (~20s max against current models) so a repair attempt is never started only to be starved by
# step_timeout's reserve; raise if a slower model is configured for the "strong" role.
repair_afford_s = 60.0

# Minimum remaining budget (seconds) required to trigger one oracle self-repair regeneration when
# prepare_gate_inputs comes back with zero usable cases in every tier (small/medium/edge) -- the
# oracle CALL succeeded but its reference()/gen()/validate() code crashed at runtime. Same cost
# profile as the initial ORACLE call and its retry (oracle_retry_afford_s), since regeneration writes
# the same reference+gen+validate functions; independent of, and can fire alongside, the adjudication
# regeneration in the repair loop (that one has no separate afford threshold -- it's gated by the
# repair loop's own repair_afford_s check instead).
oracle_selfrepair_afford_s = 130.0

# Phase boundaries as fractions of usable time (deadline*scale - margin)
[phases]
generate_until = 0.32
gate_until = 0.39
repair_until = 0.81
settle_until = 0.93
# Cap on the concurrent solve/oracle/stress calls, as a fraction of usable_s. The three run
# concurrently, so this phase costs max() of them, not sum() -- see solve.py's solve().
generate_call_share = 0.55   # effective oracle timeout = min(share*usable, fast.timeout_cap_s); measured oracle max 128s needs headroom
# Cap on a single repair call, as a fraction of usable_s -- same knob shape as generate_call_share,
# so raising/lowering it does not silently get overridden by a hardcoded fraction (see F6).
repair_call_share = 0.25

# Any OpenAI-compatible endpoint can be added as another [profiles.<name>.<role>] table.
[profiles.openrouter.strong]
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3-coder"
api_key_env = "OPENROUTER_API_KEY"
max_tokens = 12000
max_concurrent = 3
timeout_cap_s = 120.0
extra = {}   # non-reasoning models: reasoning params are ignored and burn the whole budget

[profiles.openrouter.fast]
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-chat-v3-0324"
api_key_env = "OPENROUTER_API_KEY"
max_tokens = 8000
max_concurrent = 3
timeout_cap_s = 150.0   # oracle writes reference+gen+validate; measured max 128s, so raised above it
extra = {}
